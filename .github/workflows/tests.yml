name: Tests

on:
  pull_request:
    paths:
      - 'Makefile'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.markdownlint.json'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'docs/getting_started.md'
      - 'skill-search/**'
      - 'tests/**'
      - 'tools/**'
      - 'install.sh'
      - 'skills/**'
      - 'unpack.sh'
  push:
    branches:
      - main
      - develop
    paths:
      - 'Makefile'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.markdownlint.json'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'docs/getting_started.md'
      - 'skill-search/**'
      - 'tests/**'
      - 'tools/**'
      - 'install.sh'
      - 'skills/**'
      - 'unpack.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install pre-commit
        run: python3 -m pip install pre-commit ruff

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run lint
        run: make lint

      - name: Run the test suite
        run: make test

      - name: Run the trace-based coverage summary
        if: matrix.python-version == '3.12'
        run: make test-cov

  installer:
    name: installer suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Syntax check every shell script
        run: |
          bash -n install.sh
          for f in tools/installer/*.sh; do bash -n "$f"; done

      - name: Run installer integration tests (bash ${{ matrix.os }})
        run: python3 -m unittest discover -s tests -p 'test_installer_*.py' -v

      - name: Build and smoke-test the packaged CLI
        # venv: macOS GitHub runners ship PEP 668 externally-managed Python
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install .
          .venv-smoke/bin/omd-skills --version
          .venv-smoke/bin/omd-skills --list > packaged-list.txt
          head -5 packaged-list.txt
          .venv-smoke/bin/python -m unittest discover -s tests -p 'test_cli_package.py' -v
